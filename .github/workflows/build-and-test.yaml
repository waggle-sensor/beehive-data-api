name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version-file: "go.mod"
      - run: go build -tags=duckdb_arrow -v ./...
      - run: go test -tags=duckdb_arrow -v ./...
      - run: go vet -tags=duckdb_arrow ./...
